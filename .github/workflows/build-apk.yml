name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK (cmdline-tools)
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android platform & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App & Locate Output
        run: |
          set -e
          echo "=== 1. Ejecutando build del proyecto ==="
          npm run build

          echo "=== 2. Inspeccionando carpetas generadas ==="
          ls -la
          if [ -d "dist" ]; then echo "--- Contenido de dist ---" && ls -la dist; fi
          if [ -d ".output" ]; then echo "--- Contenido de .output ---" && ls -la .output; fi
          if [ -d ".output/public" ]; then echo "--- Contenido de .output/public ---" && ls -la .output/public; fi
          if [ -d "dist/client" ]; then echo "--- Contenido de dist/client ---" && ls -la dist/client; fi

          echo "=== 3. Preparando dist/mobile ==="
          rm -rf dist/mobile
          mkdir -p dist/mobile

          if [ -d "dist/client" ] && [ "$(ls -A dist/client)" ]; then
            cp -r dist/client/* dist/mobile/
          elif [ -d ".output/public" ] && [ "$(ls -A .output/public)" ]; then
            cp -r .output/public/* dist/mobile/
          elif [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            find dist -maxdepth 1 -not -name "mobile" -not -name "dist" -exec cp -r {} dist/mobile/ \;
          else
            echo "¡No se encontraron archivos en las rutas habituales!"
            exit 1
          fi

          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
            echo "¡index.html listo en dist/mobile!"
          else
            echo "¡ERROR: No se encontró index.html en dist/mobile!"
            exit 1
          fi

      - name: Setup & Sync Capacitor
        run: |
          set -e
          echo "=== 4. Configurando Capacitor ==="
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.contave.app',
            appName: 'ContaVE',
            webDir: 'dist/mobile',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          rm -rf android
          npx cap add android --no-sync
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          set -e
          echo "=== 5. Compilando APK con Gradle ==="
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

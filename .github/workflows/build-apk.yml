name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug
      app_url:
        description: "URL web que abrirá la app"
        required: false
        default: "https://seniat-sync-buddy.lovable.app"
      app_name:
        description: "Nombre visible de la app"
        required: false
        default: "ContaVE"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del proyecto (npm install)
        run: npm install --legacy-peer-deps || npm install

      # Corregido: Actualizado a v5 para eliminar el warning de deprecación
      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar firma (solo release)
        if: ${{ inputs.mode == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Falta el secret KEYSTORE_BASE64 para compilar en release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/contave.keystore"

      - name: Compilar el APK
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
          KEYSTORE_PATH: ${{ runner.temp }}/contave.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # 1. Verificar que el script existe
          if [ ! -f "scripts/build-apk.sh" ]; then
            echo "ERROR: No se encuentra el archivo scripts/build-apk.sh en el repositorio."
            exit 1
          fi
          
          # 2. Arreglar posibles saltos de línea de Windows (CRLF a LF) que rompen bash
          sudo apt-get install -y dos2unix
          dos2unix scripts/build-apk.sh
          
          # 3. Dar permisos y ejecutar
          chmod +x scripts/build-apk.sh
          if [ "${{ inputs.mode }}" = "release" ]; then
            bash scripts/build-apk.sh --release
          else
            bash scripts/build-apk.sh
          fi

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode }}-apk
          path: |
            dist-apk/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30

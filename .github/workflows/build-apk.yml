name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Mobile Assets & Capacitor
        run: |
          # 1. Compilar la aplicación web de Lovable
          npm run build

          mkdir -p dist/mobile

          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/mobile/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/mobile/
          fi

          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
          fi

          # 2. Asegurar que Capacitor esté instalado y configurado para Android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "Inicializando Capacitor en el proyecto..."
            npx @capacitor/cli init ContaVE com.contave.app --web-dir dist/mobile --yes
          fi

          # Asegurar que las dependencias de capacitor estén instaladas
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          if [ ! -d "android" ]; then
            echo "Agregando plataforma Android..."
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

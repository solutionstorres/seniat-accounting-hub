name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "Instalando dependencias de Node..."
          npm install --legacy-peer-deps

      - name: Prepare Mobile Assets & Capacitor
        run: |
          set -e
          echo "=== 1. Construyendo la app web (npm run build) ==="
          npm run build

          echo "=== 2. Preparando carpeta mobile desde Nitro (.output/public) ==="
          mkdir -p dist/mobile

          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/mobile/
          elif [ -d "dist/client" ]; then
            cp -r dist/client/* dist/mobile/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/mobile/
          fi

          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
          fi

          echo "=== 3. Instalando y configurando Capacitor ==="
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          # Generar un archivo de configuración explícito para Capacitor apuntando a dist/mobile
          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.contave.app',
            appName: 'ContaVE',
            webDir: 'dist/mobile',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          if [ ! -d "android" ]; then
            echo "Agregando plataforma Android por primera vez..."
            npx cap add android
          else
            echo "Sincronizando proyecto Android existente..."
            npx cap sync android
          fi

      - name: Build APK with Gradle
        run: |
          set -e
          echo "=== 4. Compilando APK con Gradle ==="
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

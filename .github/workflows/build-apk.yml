name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App (Nitro)
        run: |
          set -e
          echo "=== 1. Compilando proyecto con Nitro ==="
          npm run build

          echo "=== 2. Creando y poblando dist/mobile desde .output/public ==="
          rm -rf dist/mobile
          mkdir -p dist/mobile

          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/mobile/
          elif [ -d "dist/client" ]; then
            cp -r dist/client/* dist/mobile/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/mobile/
          fi

          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
            echo "¡index.html encontrado y ajustado correctamente en dist/mobile!"
          else
            echo "¡ERROR CRÍTICO: No se encontró index.html en .output/public ni en dist/mobile!"
            exit 1
          fi

      - name: Setup & Sync Capacitor
        run: |
          set -e
          echo "=== 3. Instalando Capacitor ==="
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.contave.app',
            appName: 'ContaVE',
            webDir: 'dist/mobile',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          echo "=== 4. Añadiendo y sincronizando Android sin errores ==="
          rm -rf android
          npx cap add android --no-sync
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          set -e
          echo "=== 5. Compilando APK con Gradle ==="
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 120

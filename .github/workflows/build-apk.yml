name: Build Android APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Mobile Assets (Fix White Screen)
        run: |
          # Ejecutar el script de preparación si existe
          if [ -f "scripts/prepare-mobile.sh" ]; then
            bash scripts/prepare-mobile.sh
          else
            npm run build
          fi

          mkdir -p dist/mobile

          # Copiar los assets compilados del cliente
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/mobile/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/mobile/
          fi

          # Ajustar rutas absolutas a relativas sin errores de sintaxis en sed (evita la pantalla blanca)
          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
          fi

          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-solutorres-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

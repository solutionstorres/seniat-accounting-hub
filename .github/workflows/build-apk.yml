name: Build APK (ContaVE)

# Genera el APK de Android desde GitHub Actions.
# Cómo usarlo:
#   1. Conecta este proyecto a GitHub (menú + → GitHub → Connect project).
#   2. En el repositorio de GitHub: pestaña "Actions" → "Build APK (ContaVE)"
#      → "Run workflow".
#   3. Al terminar, descarga el APK desde la sección "Artifacts" del run.
#
# Para compilar en modo RELEASE firmado, define estos Secrets en el repo
# (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  → keytool keystore codificado: base64 -w0 contave.keystore
#   KEYSTORE_PASS    → contraseña del keystore
#   KEY_ALIAS        → alias de la llave (ej: contave)
#   KEY_PASS         → contraseña de la llave

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug
      app_url:
        description: "URL web que abrirá la app"
        required: false
        default: "https://seniat-sync-buddy.lovable.app"
      app_name:
        description: "Nombre visible de la app"
        required: false
        default: "ContaVE"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma (solo release)
        if: ${{ inputs.mode == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Falta el secret KEYSTORE_BASE64 para compilar en release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/contave.keystore"

      - name: Compilar el APK
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
          KEYSTORE_PATH: ${{ runner.temp }}/contave.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ "${{ inputs.mode }}" = "release" ]; then
            bash scripts/build-apk.sh --release
          else
            bash scripts/build-apk.sh
          fi

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode }}-apk
          path: dist-apk/*.apk
          retention-days: 30

name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure index.html exists for Vite
        run: |
          if [ ! -f "index.html" ]; then
            echo "Creando index.html base para SPA..."
            cat <<EOF > index.html
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>ContaVE</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF
          fi

      - name: Build Web App & Prepare Mobile Assets
        run: |
          set -e
          echo "=== 1. Compilando aplicación con Vite ==="
          npx vite build --outDir dist-temp

          echo "=== 2. Preparando dist/mobile de forma segura ==="
          rm -rf dist/mobile
          mkdir -p dist/mobile
          cp -r dist-temp/* dist/mobile/
          rm -rf dist-temp

          if [ -f "dist/mobile/index.html" ]; then
            sed -i 's|href="/|href="./|g' dist/mobile/index.html
            sed -i 's|src="/|src="./|g' dist/mobile/index.html
            echo "¡index.html listo en dist/mobile!"
          else
            echo "¡ERROR: No se generó el index.html!"
            exit 1
          fi

      - name: Setup & Sync Capacitor
        run: |
          set -e
          echo "=== 3. Configurando Capacitor ==="
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.contave.app',
            appName: 'ContaVE',
            webDir: 'dist/mobile',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          rm -rf android
          npx cap add android --no-sync
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          set -e
          echo "=== 4. Compilando APK con Gradle ==="
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

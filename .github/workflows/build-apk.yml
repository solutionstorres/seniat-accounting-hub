name: Build APK (ContaVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de compilación"
        type: choice
        options:
          - debug
          - release
        default: debug
      app_url:
        description: "URL de la aplicación web"
        default: "https://contave.lovable.app"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.contave.app
      APP_NAME: ContaVE
      APP_URL: ${{ inputs.app_url || 'https://contave.lovable.app' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK (cmdline-tools)
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android platform & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Preparar contenedor web (dist/mobile)
        run: |
          set -e
          rm -rf dist/mobile
          mkdir -p dist/mobile
          cat > dist/mobile/index.html <<HTML
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
          <title>${APP_NAME}</title>
          <style>
            html,body{margin:0;height:100%;background:#0A2540;color:#fff;font-family:system-ui,-apple-system,sans-serif}
            .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
            b{font-size:22px} p{opacity:.75;font-size:14px;margin:0}
            button{margin-top:8px;padding:12px 20px;border:0;border-radius:10px;background:#F59E0B;color:#0A2540;font-weight:700;font-size:15px}
          </style>
          </head>
          <body>
            <div class="c">
              <b>${APP_NAME}</b>
              <p id="m">Conectando…</p>
              <button onclick="go()">Reintentar</button>
            </div>
          <script>
            var URL_APP = "${APP_URL}";
            function go(){ document.getElementById('m').textContent='Conectando…'; location.replace(URL_APP); }
            if (navigator.onLine) { go(); } else { document.getElementById('m').textContent='Sin conexión a internet.'; }
          </script>
          </body>
          </html>
          HTML
          test -f dist/mobile/index.html && echo "index.html listo en dist/mobile"

      - name: Setup & Sync Capacitor
        run: |
          set -e
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps
          cat > capacitor.config.json <<JSON
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist/mobile",
            "server": { "url": "${APP_URL}", "cleartext": false, "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          JSON
          rm -rf android capacitor.config.ts
          npx cap add android --no-sync
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          set -e
          cd android
          chmod +x gradlew
          if [ "${{ inputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ContaVE-${{ inputs.mode || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
